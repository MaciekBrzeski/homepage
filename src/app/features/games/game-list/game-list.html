<div class="page">
  <h1 class="page-title">Games</h1>
  <p class="lead">
    Small browser games. No install, no account: they run in this tab and save progress in your
    browser.
  </p>
  <div class="grid games tilt">
    @for (g of games; track g.slug) {
      <app-game-card [game]="g" />
    }
  </div>
</div>
