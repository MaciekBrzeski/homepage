name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Typecheck e2e
        run: npm run typecheck:e2e

      - name: Unit tests
        run: npx ng test --watch=false

      # The games are separate repos and are not checked out here; their play/ paths serve
      # the 404 page in CI, which the e2e suite tolerates (it never asserts on game internals).
      - name: Build and assemble the static site
        run: npm run build:site -- --skip-games

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E and accessibility (axe)
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
